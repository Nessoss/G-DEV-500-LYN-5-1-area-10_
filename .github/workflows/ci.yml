name: CI
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  sync-to-old-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EPITECH_DEPLOY_KEY }}" | base64 -d > ~/.ssh/id_ed25519_epitech
          chmod 600 ~/.ssh/id_ed25519_epitech
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -T -i ~/.ssh/id_ed25519_epitech git@github.com || true

      - name: Push to old repository
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/id_ed25519_epitech -o IdentitiesOnly=yes"
        run: |
          git remote add epitech git@github.com:Nessoss/Test_repo.git
          git push epitech ${{ github.ref_name }} --force
  frontend:
    name: Frontend - ESLint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build project
        run: npm run build

  backend:
    name: Backend - ESLint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run ESLint
        run: npm run lint
      - name: Build project
        run: npm run build
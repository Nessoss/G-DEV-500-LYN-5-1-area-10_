name: CI
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  sync-to-old-repo:
    name: Sync to Epitech repository
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # Seulement sur push, pas sur PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tout l'historique
          
      - name: Push to old repository
        env:
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          git remote add epitech https://x-access-token:${OLD_REPO_TOKEN}@github.com/EpitechPGE3-2025/G-DEV-500-LYN-5-1-area-10.git
          git push epitech ${{ github.ref_name }} --force

  frontend:
    name: Frontend - ESLint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build project
        run: npm run build

  backend:
    name: Backend - ESLint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run ESLint
        run: npm run lint
      - name: Build project
        run: npm run build
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
    volumes:
      - shared_volume:/shared

  # client_mobile:
  #   build:
  #     context: ./frontend/mobile
  #     dockerfile: Dockerfile
  #   container_name: client_mobile
  #   volumes:
  #     - shared_volume:/shared

  client_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: client_web
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
    depends_on:
      - server
      # - client_mobile
    volumes:
      - shared_volume:/shared

volumes:
  shared_volume:
  postgres_data:

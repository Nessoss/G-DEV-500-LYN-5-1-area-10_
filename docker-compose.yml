services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - shared_volume:/shared
    depends_on:
      - postgres

  # client_mobile:
  #   build:
  #     context: ./frontend/mobile
  #     dockerfile: Dockerfile
  #   container_name: client_mobile
  #   volumes:
  #     - shared_volume:/shared

  client_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: client_web
    ports:
      - "8081:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - server
      # - client_mobile
    volumes:
      - shared_volume:/shared

volumes:
  shared_volume:
  postgres_data:
